<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Считать ворон</title>
    </head>
    <body>

        <h1>Считать ворон</h1>

        <form id="crowForm">
            <div>
                <label for ="num">Количество ворон:</label>
                <input type="number" id="num" min="0" required>
            </div>
            <button type="submit">Считать</button>
        </form>

        <script>
            'use strict';

document.getElementById('crowForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const num = parseInt(document.getElementById('num').value);


    if (isNaN(num) || num < 0) {
        alert("Введите корректное число");
        return;
    }

    let ending;

    const lastTwoDigits = num % 100;
    const lastDigit = num % 10;


    if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
        ending = "ворон";
    } else {

        switch (lastDigit) {
            case 1:
                ending = "ворона";
                break;
            case 2:
            case 3:
            case 4:
                ending = "вороны";
                break;
            default:
                ending = "ворон";
        }
    }

    alert(`На ветке сидит ${num} ${ending}`);
});


        </script>
    </body>
</html>
