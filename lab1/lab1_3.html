<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод числа</title>
</head>
<body>

    <h1>Ввод числа</h1>
    
    <a href="index.html" id="getNumberLink">Получить число</a>

    <script>
        'use strict';

        function askForNumber() {
            while (true) {
                let input = prompt("Введите число, большее 100:");
                
                if (input === null) {
                    return false;
                }
                
                let num = Number(input);
                
                if (!isNaN(num) && num > 100) {
                    return true;
                }
            }
        }

        const link = document.getElementById('getNumberLink');

        link.addEventListener('click', function(event) {
            event.preventDefault();

            const success = askForNumber();
            
            if (success) {
                window.location.href = '../index.html'; 
            } else {
                const allow = confirm("Вы не ввели число больше 100. Всё равно перейти?");
                if (allow) {
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
