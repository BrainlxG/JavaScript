<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простые числа</title>
</head>
<body>

    <h1>Простые числа</h1>
    
    <form id="primeForm">
        <div>
            <label for="number">Введите число n (n ≥ 2):</label>
            <input type="number" id="number" min="2" required>
        </div>
        <button type="submit">Найти</button>
    </form>

    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        'use strict';

        function findPrimes(max) {
            const primes = []; 

            for (let i = 2; i <= max; i++) {
                let isPrime = true; 

                for (let j = 2; j < i; j++) {
                    if (i % j === 0) {
                        isPrime = false; 
                        break;           
                    }
                }

                if (isPrime) {
                    primes.push(i);
                }
            }

            return primes;
        }

        document.getElementById('primeForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const n = parseInt(document.getElementById('number').value);
            const resultDiv = document.getElementById('result');

            if (isNaN(n) || n < 2) {
                resultDiv.innerHTML = 'Пожалуйста, введите число больше или равное 2';
                return;
            }

            const primes = findPrimes(n);

            if (primes.length === 0) {
                resultDiv.innerHTML = 'Простых чисел не найдено';
            } else {
                resultDiv.innerHTML = `Простые числа от 2 до ${n}:<br>${primes.join(' ')}`;
            }
        });
    </script>
</body>
</html>
