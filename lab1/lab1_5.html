<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица</title>
</head>
<body>

    <h1>Таблица</h1>
    
    <form id="tableForm">
        <div>
            <label for="rows">Количество строк (n ≥ 1):</label>
            <input type="number" id="rows" min="1" required>
        </div>
        <button type="submit">Рисовать</button>
    </form>
    
    <p style="color: green;">Результат смотрите в консоли браузера (F12)</p>

    <script>
        'use strict';

        function drawTable(rows) {
            const pattern = ['dog', 'dog', 'dog', 'cat', 'cat'];
            let patternIndex = 0;

            for (let i = 0; i < rows; i++) {
                let rowArr = []; 

                for (let j = 0; j < 6; j++) {
                    rowArr.push(pattern[patternIndex % pattern.length]);
                    patternIndex++;
                }

                console.log(rowArr.join('\t'));
            }
        }

        document.getElementById('tableForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const rows = parseInt(document.getElementById('rows').value);

            if (isNaN(rows) || rows < 1) {
                alert("Введите корректное число строк");
                return;
            }

            console.clear();
            drawTable(rows);
        });
    </script>
</body>
</html>
