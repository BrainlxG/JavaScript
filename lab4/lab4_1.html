<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №4</title>
</head>
<body>
    <h1>Лабораторная работа №4</h1>
    <p>Откройте консоль разработчика (F12 -> Console), чтобы увидеть результаты.</p>

    <script type="module">
        import {
            Book,
            isEmpty,
            addClassMethods,
            getSecondsToday,
            formatDate
        } from './lab4.js';

        const book1 = new Book("Мастер и Маргарита", 1967, 550);
        book1.show();

        const book2 = new Book("Тихий Дон", 1940, 480);
        console.log(`До изменения: ${book2.title}, ${book2.pubYear}, ${book2.price}`);

        book2.title = "Доктор Живаго";
        book2.pubYear = 1957;
        book2.price = 620;
        console.log(`После изменения: ${book2.title}, ${book2.pubYear}, ${book2.price}`);

        try {
            book2.title = "";
        } catch(e) {
            console.log(e.message);
        }

        try {
            book2.pubYear = -1957;
        } catch(e) {
            console.log(e.message);
        }

        try {
            book2.price = -100;
        } catch(e) {
            console.log(e.message);
        }

        const books = [
            new Book("Евгений Онегин", 1833, 350),
            new Book("Герой нашего времени", 1840, 320),
            new Book("Мертвые души", 1842, 400)
        ];

        console.log("До сортировки:");
        books.forEach(book => console.log(`${book.title} - ${book.pubYear}`));

        books.sort(Book.compare);

        console.log("После сортировки:");
        books.forEach(book => console.log(`${book.title} - ${book.pubYear}`));

        console.log("isEmpty({}):", isEmpty({}));
        console.log("isEmpty({ [Symbol()]: true }):", isEmpty({ [Symbol()]: true }));
        console.log("isEmpty(Object.defineProperty):", isEmpty(Object.defineProperty({}, 'name', { value: 'John' })));

        let obj = { className: 'open menu' };
        obj = addClassMethods(obj);

        obj.addClass('new').addClass('open').addClass('active');
        console.log("Классы после добавления:", obj.className);

        obj.removeClass('menu').removeClass('active');
        console.log("Классы после удаления:", obj.className);

        const testObj = {
            name: "Литература",
            author: {
                name: "Пушкин",
                year: 1799
            }
        };

        const json = JSON.stringify(testObj, null, 2);
        console.log("JSON строка:\n", json);

        const obj2 = JSON.parse(json);
        console.log("Объекты равны:", JSON.stringify(testObj) === JSON.stringify(obj2));

        console.log("Секунд с начала дня:", getSecondsToday());

        console.log("Сегодняшняя дата:", formatDate(new Date()));
    </script>
</body>
</html>
