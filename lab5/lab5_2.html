<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дерево</title>
    <style>
        .node-text { cursor: pointer; color: #333; }
        .node-text:hover { color: #0056b3; text-decoration: underline; }
        li.closed > ul { display: none; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        'use strict';
        const data = {
            "Рыбы": { "форель": {}, "лосось": {} },
            "Деревья": {
                "Огромные": { "секвойя": {}, "дуб": {} },
                "Цветковые": { "яблоня": {}, "магнолия": {} }
            }
        };

        function createTree(container, data) {
            const ul = document.createElement('ul');
            for (let key in data) {
                const li = document.createElement('li');
                const span = document.createElement('span');
                span.textContent = key;
                span.classList.add('node-text');
                li.appendChild(span);

                const children = data[key];
                if (Object.keys(children).length > 0) {
                    createTree(li, children);
                    span.addEventListener('click', function(e) {
                        e.preventDefault();
                        li.classList.toggle('closed');
                    });
                }
                ul.appendChild(li);
            }
            container.appendChild(ul);
        }

        const container = document.getElementById('container');
        createTree(container, data);
    </script>
</body>
</html>
