<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактируемая таблица</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #00ff22; padding: 30px; }
        td textarea { width: 100%; height: 100%; box-sizing: border-box; resize: none; }
        .edit-buttons { margin-top: 5px; }
    </style>
</head>
<body>
    <table id="editable-table">
        <tr>
            <th>Колонка 1</th>
            <th>Колонка 2</th>
        </tr>
        <tr>
            <td>Клетка 1</td>
            <td>Клетка 2</td>
        </tr>
        <tr>
            <td>Клетка 3</td>
            <td>Клетка 4</td>
        </tr>
    </table>

    <script>
        'use strict';
        const table = document.getElementById('editable-table');

        if (sessionStorage.getItem('tableHTML')) {
            table.innerHTML = sessionStorage.getItem('tableHTML');
        }

        table.addEventListener('click', function (event) {
            let target = event.target;

            if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
            if (document.querySelector('td.editing')) return;

            while (target && target !== this) {
                if (target.tagName === 'TD') {
                    startEditing(target);
                    return;
                }
                target = target.parentNode;
            }
        });

        function startEditing(td) {
            td.classList.add('editing');
            let currentHtml = td.innerHTML;
            td.setAttribute('original-html', currentHtml);
            
            td.innerHTML = `<textarea>${currentHtml}</textarea>
                  <div class="edit-buttons">
                    <button class="ok-button">OK</button>
                    <button class="cancel-button">ОТМЕНА</button>
                  </div>`;

            td.querySelector('textarea').focus();

            td.querySelector('.ok-button').addEventListener('click', function () {
                finishEditing(td, true);
            });

            td.querySelector('.cancel-button').addEventListener('click', function () {
                finishEditing(td, false);
            });
        }

        function finishEditing(td, isSave) {
            let textarea = td.querySelector('textarea');
            let originalHtml = td.getAttribute('original-html');

            if (isSave) {
                td.innerHTML = textarea.value;
                sessionStorage.setItem('tableHTML', table.innerHTML);
            } else {
                td.innerHTML = originalHtml;
            }
            td.classList.remove('editing');
        }
    </script>
</body>
</html>
